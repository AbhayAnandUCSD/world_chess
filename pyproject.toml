[project]
name = "world-chess"
version = "0.1.0"
description = "Do player-specific fine-tunes of a chess LM change move preferences while preserving linearly decodable board state?"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.4",
  "numpy",
  "python-chess",
  "pandas",
  "matplotlib",
  "pyyaml",
  "huggingface_hub",
  "fastapi",
  "uvicorn",
  "tqdm",
  "wandb>=0.31.0",
  "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wc"]

[tool.uv]
package = true
